name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:    

jobs:

  # ==========================
  # 1. TEST STAGE
  # ==========================

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install Dependencies
        working-directory: src
        run: npm ci

      - name: Run Lint
        working-directory: src
        run: npm run lint

      - name: Start Application
        working-directory: src
        run: npm start &

      - name: Wait for Application
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:3000; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to start"
          exit 1

      - name: Run Integration Tests
        working-directory: src
        run: npm test


  # =========================
  # 2. BUILD STAGE
  # =========================

  build:
    name: Build Docker Image

    # Build will only run if test passes
    needs: test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Build Docker Image
        run: |
          docker build \
            -t nodejs-demoapp:${{ github.sha }} \
            .

      - name: Save Docker Image
        run: |
          docker save \
            nodejs-demoapp:${{ github.sha }} \
            -o nodejs-demoapp.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: nodejs-demoapp.tar
          retention-days: 1


# =========================
  # 3. PUBLISH STAGE
  # =========================

  publish:
    name: Publish Image to Docker Hub

    # Publish requires BOTH test and build
    needs:
      - test
      - build

    runs-on: ubuntu-latest

    # Never publish Docker images from pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker Image
        run: |
          docker load -i nodejs-demoapp.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag \
            nodejs-demoapp:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-demoapp:${{ github.sha }}

          docker tag \
            nodejs-demoapp:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-demoapp:latest

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-demoapp:${{ github.sha }}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-demoapp:latest